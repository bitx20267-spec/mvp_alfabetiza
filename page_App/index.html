<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Alfabetiza+ - Curso de Letramento Digital">
    <title>Alfabetiza+ - Login</title>
    <link rel="stylesheet" href="stylepagecolor.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <header class="login-header">
                <h1 class="logo">Alfabetiza+</h1>

                <h2 class="login-title">
                    Bem-vindo ao curso de Letramento Digital
                </h2>

                <p class="login-description">
                    Acesse sua conta para continuar seus estudos.
                </p>
            </header>


            <form class="login-form">

                <div class="form-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email@gmail.com"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <div class="form-options">

                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Lembrar de mim</span>
                    </label>

                    <a href="../page_App/esqueci_a_senha.html" class="forgot-password">
                        Esqueci minha senha
                    </a>

                </div>


                <button type="submit" class="login-button" >
                    Entrar
                </button>

            </form>


            <footer class="login-footer">

                <p>
                    Ainda não tem uma conta?
                    <a href="../page_App/cadastro.html" class="register-link">
                        Cadastre-se
                    </a>
                </p>
                <p>Ou se preferir, entre sem cadastro.</p> <br>
                <a id="continue-btn" href="home.html">Continuar</a>

            </footer>

        </section>

    </main>

</body>

</html>
