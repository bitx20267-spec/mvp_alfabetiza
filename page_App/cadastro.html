<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Alfabetiza+ - Cadastro">

    <title>Alfabetiza+ | Cadastro</title>

    <link rel="stylesheet" href="stylepagecolor.css">
</head>

<body>

    <main class="cadastro-page">

        <section class="cadastro-card">

            <header class="cadastro-header">

                <h1 class="logo">Alfabetiza+</h1>

                <h2 class="cadastro-title">
                    Crie sua conta
                </h2>

                <p class="cadastro-description">
                    Preencha seus dados para começar o curso de Letramento Digital.
                </p>

            </header>


            <form class="cadastro-form">

                <div class="form-group">

                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button type="submit" class="cadastro-button">
                    Criar conta
                </button>

            </form>


            <footer class="cadastro-footer">

                <p>
                    Já possui uma conta?
                    <a href="index.html" class="login-link">
                        Entrar
                    </a>
                </p>

            </footer>

        </section>

    </main>

</body>

</html>
