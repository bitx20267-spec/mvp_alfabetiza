<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Alfabetiza+ - Recuperação de senha">

    <title>Alfabetiza+ | Esqueci minha senha</title>

    <link rel="stylesheet" href="stylepagecolor.css">
</head>

<body>

    <main class="recuperacao-page">

        <section class="recuperacao-card">

            <header class="recuperacao-header">

                <h1 class="logo">Alfabetiza+</h1>

                <h2 class="recuperacao-title">
                    Esqueceu sua senha?
                </h2>

                <p class="recuperacao-description">
                    Não se preocupe! Digite seu e-mail e enviaremos
                    as instruções para criar uma nova senha.
                </p>

            </header>


            <form class="recuperacao-form">

                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <button type="submit" class="recuperacao-button">
                    Recuperar senha
                </button>

            </form>


            <footer class="recuperacao-footer">

                <a href="index.html" class="back-login">
                    ← Voltar para o login
                </a>

            </footer>

        </section>

    </main>

</body>

</html>
